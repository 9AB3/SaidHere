name: SaidHere checks

on:
  push:
  pull_request:

concurrency:
  group: saidhere-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/bootstrap_platforms.py --host saidhere.app
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Flutter web
        run: flutter build web --release --dart-define=API_BASE_URL=https://saidhere.app
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://saidhere.app
      - name: Check Render API JavaScript
        run: npm --prefix server run check
