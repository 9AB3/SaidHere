workflows:
  saidhere-checks:
    name: SaidHere checks
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        APP_HOST: nfc.saidhere.app
        API_BASE_URL: https://saidhere.app
    scripts:
      - name: Generate Flutter platform projects
        script: python3 tool/bootstrap_platforms.py --host "$APP_HOST"
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build web
        script: >-
          flutter build web --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=APP_HOST="$APP_HOST"
          --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}"
      - name: Build Android debug APK
        script: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=APP_HOST="$APP_HOST"
          --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}"
      - name: Compile iOS without signing
        script: >-
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=APP_HOST="$APP_HOST"
          --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}"
    artifacts:
      - build/web/**
      - build/app/outputs/flutter-apk/*.apk

  saidhere-android:
    name: The Wall Android release
    max_build_duration: 60
    environment:
      groups:
        - android_maps_config
      android_signing:
        - saidhere_android_upload
      flutter: stable
      vars:
        APP_HOST: nfc.saidhere.app
        API_BASE_URL: https://saidhere.app
    scripts:
      - name: Generate Android release project
        script: |
          set -euo pipefail
          test -n "${ANDROID_GOOGLE_MAPS_API_KEY:-}" || { echo 'FAIL: Add ANDROID_GOOGLE_MAPS_API_KEY to the android_maps_config Codemagic group.'; exit 1; }
          export GOOGLE_MAPS_API_KEY="$ANDROID_GOOGLE_MAPS_API_KEY"
          python3 tool/bootstrap_platforms.py --host "$APP_HOST"
          python3 tool/android_release_patch.py --host "$APP_HOST"
          flutter pub get
      - name: Verify Android production configuration
        script: |
          set -euo pipefail
          test -n "${CM_KEYSTORE_PATH:-}" || { echo 'FAIL: Upload the Android keystore to Codemagic with reference saidhere_android_upload.'; exit 1; }
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.NFC' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="saidhere"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="nfc.saidhere.app"' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml
          grep -q 'SAIDHERE_RELEASE_SIGNING' android/app/build.gradle.kts || grep -q 'SAIDHERE_RELEASE_SIGNING' android/app/build.gradle
          grep -q 'saidhere/nfc_writer' android/app/src/main/kotlin/app/saidhere/said_here/MainActivity.kt
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        script: flutter test
      - name: Build signed Android App Bundle
        script: |
          set -euo pipefail
          BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
          flutter build appbundle --release \
            --build-name=0.1.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_HOST="$APP_HOST" \
            --dart-define=GOOGLE_MAPS_API_KEY="$ANDROID_GOOGLE_MAPS_API_KEY"
          jarsigner -verify -strict build/app/outputs/bundle/release/app-release.aab
      - name: Build signed Android APK
        script: |
          set -euo pipefail
          BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
          flutter build apk --release \
            --build-name=0.1.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_HOST="$APP_HOST" \
            --dart-define=GOOGLE_MAPS_API_KEY="$ANDROID_GOOGLE_MAPS_API_KEY"
      - name: Print upload certificate fingerprints
        script: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            -keypass "$CM_KEY_PASSWORD" | grep -E 'SHA1:|SHA256:' || true
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*-release.apk

  saidhere-ios:
    name: SaidHere iOS TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - maps_config
      flutter: stable
      xcode: latest
      vars:
        APP_HOST: nfc.saidhere.app
        API_BASE_URL: https://saidhere.app
      ios_signing:
        provisioning_profiles:
          - profile: saidhere_app_store
            environment_variable: SAIDHERE_PROFILE
    scripts:
      - name: Verify live NFC Universal Link origin
        script: |
          set -euo pipefail
          HOST="$APP_HOST"
          ORIGIN="https://${HOST}/.well-known/apple-app-site-association"
          CDN="https://app-site-association.cdn-apple.com/a/v1/${HOST}"
          echo '--- SaidHere NFC origin AASA ---'
          curl --fail --silent --show-error --max-redirs 0 -D /tmp/aasa-origin.headers "$ORIGIN" -o /tmp/aasa-origin.json
          cat /tmp/aasa-origin.headers
          cat /tmp/aasa-origin.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/aasa-origin.json'))
          details=j.get('applinks',{}).get('details',[])
          ok=any(d.get('appID')=='7MB2M6PX4Y.com.9ab3.saidhere' and '/t/*' in d.get('paths',[]) and '/w/*' in d.get('paths',[]) for d in details)
          if not ok: raise SystemExit('FAIL: live NFC AASA does not authorize SaidHere /t/* and /w/* links')
          print('PASS: live NFC origin AASA authorizes SaidHere links')
          PY
          grep -qi '^content-type:.*application/json' /tmp/aasa-origin.headers || { echo 'FAIL: NFC AASA Content-Type is not application/json'; exit 1; }
          echo '--- Apple Associated Domains CDN for NFC host ---'
          CDN_CODE=$(curl --silent --show-error -D /tmp/aasa-cdn.headers -o /tmp/aasa-cdn.body -w '%{http_code}' "$CDN" || true)
          cat /tmp/aasa-cdn.headers || true
          cat /tmp/aasa-cdn.body || true
          if [ "$CDN_CODE" = '200' ]; then
            echo 'PASS: Apple CDN already has the SaidHere NFC association.'
          else
            echo "INFO: Apple CDN is not cached yet (HTTP $CDN_CODE). First dedicated-domain build can continue so Apple can register it."
          fi
      - name: Generate SaidHere iOS project
        script: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}" || { echo 'FAIL: Add GOOGLE_MAPS_API_KEY as a secure Codemagic environment variable before building the Found map.'; exit 1; }
          python3 tool/bootstrap_platforms.py --host "$APP_HOST"
          flutter pub get
          grep -q 'com.9ab3.saidhere' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'applinks:nfc.saidhere.app' ios/Runner/Runner.entitlements
          grep -q 'com.apple.developer.nfc.readersession.formats' ios/Runner/Runner.entitlements
          grep -q '<string>TAG</string>' ios/Runner/Runner.entitlements
          grep -q 'NFCReaderUsageDescription' ios/Runner/Info.plist
          grep -q 'NSLocationWhenInUseUsageDescription' ios/Runner/Info.plist
          grep -q 'GMSApiKey' ios/Runner/Info.plist
          grep -q 'CoreNFC' ios/Runner/AppDelegate.swift
          grep -q 'GoogleMaps' ios/Runner/AppDelegate.swift
          grep -q 'GMSServices.provideAPIKey' ios/Runner/AppDelegate.swift
          grep -q 'nfcTarget(fromDeepLink' ios/Runner/AppDelegate.swift
          grep -q 'beginQueuedNfcWriteIfPossible' ios/Runner/AppDelegate.swift
          grep -q 'private var nfcWriterChannel' ios/Runner/AppDelegate.swift
          grep -q 'installNfcWriterChannelIfPossible' ios/Runner/AppDelegate.swift
          grep -q 'activeFlutterViewController' ios/Runner/AppDelegate.swift
          grep -q 'confirmNfcWriteReceipt' ios/Runner/AppDelegate.swift
          grep -q 'api/fulfilment/nfc-written' ios/Runner/AppDelegate.swift
          grep -q 'pendingNfcReceipt' ios/Runner/AppDelegate.swift
          grep -q '^CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements$' ios/Flutter/Release.xcconfig
      - name: Configure iOS signing
        script: |
          set -euo pipefail
          test -n "${SAIDHERE_PROFILE:-}" && test -f "$SAIDHERE_PROFILE"
          xcode-project use-profiles --project ios/Runner.xcodeproj --profile "$SAIDHERE_PROFILE"
          security cms -D -i "$SAIDHERE_PROFILE" > /tmp/saidhere-profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/saidhere-profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' /tmp/saidhere-profile.plist | tee /tmp/saidhere-domains.txt
          if grep -q 'saidhere.app' /tmp/saidhere-domains.txt || grep -qx '\*' /tmp/saidhere-domains.txt; then
            echo 'PASS: provisioning profile authorizes Associated Domains'
          else
            echo 'FAIL: provisioning profile does not authorize Associated Domains'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.nfc.readersession.formats' /tmp/saidhere-profile.plist > /tmp/saidhere-profile-nfc.txt 2>/dev/null; then
            cat /tmp/saidhere-profile-nfc.txt
            grep -q 'TAG' /tmp/saidhere-profile-nfc.txt || { echo 'FAIL: provisioning profile NFC entitlement is missing TAG'; exit 1; }
            echo 'PASS: provisioning profile authorizes NFC Tag Reading'
          else
            echo 'FAIL: provisioning profile does not authorize NFC Tag Reading. Enable NFC Tag Reading on the SaidHere App ID and regenerate the profile.'
            exit 1
          fi
          echo '--- Requested SaidHere entitlements ---'
          cat ios/Runner/Runner.entitlements
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains:0' ios/Runner/Runner.entitlements | tee /tmp/requested-domain.txt
          grep -qx 'applinks:nfc.saidhere.app' /tmp/requested-domain.txt || { echo 'FAIL: Runner.entitlements is missing applinks:nfc.saidhere.app'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.formats' ios/Runner/Runner.entitlements | tee /tmp/requested-nfc.txt
          grep -q 'TAG' /tmp/requested-nfc.txt || { echo 'FAIL: Runner.entitlements is missing NFC TAG access'; exit 1; }
          echo '--- Release CODE_SIGN_ENTITLEMENTS build setting ---'
          xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Release -showBuildSettings | grep 'CODE_SIGN_ENTITLEMENTS' | tee /tmp/code-sign-entitlements.txt
          grep -q 'Runner/Runner.entitlements' /tmp/code-sign-entitlements.txt || { echo 'FAIL: Xcode Release build is not using Runner.entitlements'; exit 1; }
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build signed IPA
        script: |
          set -euo pipefail
          test -n "${PROJECT_BUILD_NUMBER:-}"
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_HOST="$APP_HOST" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
          APP_PATH=$(find build/ios/archive/Runner.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > /tmp/saidhere-signed-entitlements.plist 2>/dev/null
          echo '--- Final signed SaidHere entitlements ---'
          cat /tmp/saidhere-signed-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains' /tmp/saidhere-signed-entitlements.plist | tee /tmp/saidhere-signed-domains.txt
          grep -q 'applinks:nfc.saidhere.app' /tmp/saidhere-signed-domains.txt || { echo 'FAIL: final signed app is missing applinks:nfc.saidhere.app'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.formats' /tmp/saidhere-signed-entitlements.plist | tee /tmp/saidhere-signed-nfc.txt
          grep -q 'TAG' /tmp/saidhere-signed-nfc.txt || { echo 'FAIL: final signed app is missing NFC TAG entitlement'; exit 1; }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
