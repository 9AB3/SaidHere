<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171411">
  <title>Open a Wall | The Wall</title>
  <meta name="description" content="You found a Wall. Install The Wall app to read and leave messages.">
  <style>
    :root{--ink:#171411;--paper:#f5ede0;--muted:#6b6053}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{color:var(--ink);background:linear-gradient(rgba(235,224,204,.77),rgba(235,224,204,.85)),url('/wall-background.png') center/cover fixed no-repeat}
    .page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom))}
    .content{width:min(100%,390px);text-align:center;margin:auto 0}
    .plaque{display:block;width:150px;max-width:50vw;height:auto;margin:0 auto 20px;filter:drop-shadow(0 12px 18px rgba(30,23,15,.22))}
    .eyebrow{margin:0 0 10px;color:#62574a;font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
    h1{margin:0;font-size:clamp(30px,9vw,40px);line-height:1.04;letter-spacing:-1.5px;font-weight:950}
    .description{max-width:310px;margin:14px auto 24px;color:#554d43;font-size:15px;line-height:1.45;font-weight:600}
    .stores{display:grid;gap:10px}
    .store{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 16px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:14px;font-weight:900}
    .store.secondary{background:rgba(255,251,244,.74);color:var(--ink)}
    .store:focus-visible,.installed a:focus-visible,footer a:focus-visible{outline:3px solid #806042;outline-offset:3px}
    .installed{margin:22px 0 0;font-size:13px;color:var(--muted)}
    .installed a{color:var(--ink);font-weight:900;text-underline-offset:3px}
    footer{display:flex;gap:20px;justify-content:center;margin-top:30px;font-size:11px;font-weight:800}
    footer a{color:#554a3e;text-decoration:none}
    @media(max-height:650px){.plaque{width:105px;margin-bottom:12px}.description{margin-bottom:17px}.installed{margin-top:15px}footer{margin-top:18px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="content">
      <img class="plaque" src="/plaque.png" alt="The Wall">
      <p class="eyebrow">You found a Wall</p>
      <h1>See what’s on it.</h1>
      <p class="description">Get The Wall app to read messages and leave your own.</p>
      <nav class="stores" aria-label="Download The Wall">
        <a class="store" href="https://apps.apple.com/au/app/id6823565189">Download on the App Store</a>
        <a class="store secondary" href="https://play.google.com/store/apps/details?id=app.saidhere.said_here">Get it on Google Play</a>
      </nav>
      <p class="installed">Already installed? <a id="open-app" href="saidhere://">Open this Wall</a></p>
    </section>
    <footer><a href="/privacy/">Privacy</a><a href="/support/">Support</a></footer>
  </main>
</body>
</html>
