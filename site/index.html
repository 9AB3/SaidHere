<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <title>The Wall</title>
  <style>
    :root{--ink:#17130f;--paper:#d8ccb6;--paper2:#b7a68c;--rust:#7e4b32;--muted:#5d5548}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{color:var(--ink);font-family:"Courier New",monospace;background:#8d806c url('/the-wall.png') center/cover fixed no-repeat;padding:24px;display:grid;place-items:center;position:relative}
    body::before{content:"";position:fixed;inset:0;background:rgba(216,204,182,.48);backdrop-filter:grayscale(.18) contrast(.94);pointer-events:none}
    main{position:relative;width:min(650px,100%);text-align:center;padding:8px 0 18px}
    .logo{width:min(520px,92vw);height:250px;margin:0 auto 20px;border:2px solid rgba(23,19,15,.75);box-shadow:6px 7px 0 rgba(23,19,15,.35);transform:rotate(-1deg);overflow:hidden;background:#b7a68c}
    .logo img{width:100%;height:100%;object-fit:cover;object-position:center}
    .tagline{display:inline-block;margin:0 auto 30px;padding:8px 12px;background:rgba(216,204,182,.88);font-weight:900;letter-spacing:.4px;transform:rotate(.7deg);box-shadow:2px 3px 0 rgba(23,19,15,.24)}
    .card{position:relative;border:2px solid rgba(23,19,15,.82);border-radius:3px;padding:30px 24px;background:rgba(225,213,192,.91);box-shadow:6px 8px 0 rgba(23,19,15,.34);transform:rotate(.35deg)}
    .card::after{content:"";position:absolute;left:7%;right:10%;top:22px;border-top:1px solid rgba(126,75,50,.35);transform:rotate(-2deg)}
    .tap{font-size:38px;margin-bottom:8px}
    h1{font-size:27px;margin:0 0 11px;font-weight:900;text-transform:uppercase;letter-spacing:-1px}
    p{line-height:1.55;font-weight:600}.muted{color:var(--muted);font-size:13px}
    .button{display:inline-block;margin-top:12px;padding:15px 22px;background:var(--ink);color:var(--paper);border:2px solid #3e342a;border-radius:2px;text-decoration:none;font-weight:900;letter-spacing:.4px;box-shadow:3px 4px 0 rgba(23,19,15,.28);transform:rotate(-.5deg)}
    .button:active{transform:translate(2px,2px) rotate(-.5deg);box-shadow:1px 2px 0 rgba(23,19,15,.28)}
    footer{margin-top:28px;font-size:13px;font-weight:700}footer a{color:var(--ink);background:rgba(216,204,182,.72);padding:4px 7px;text-decoration:none}
    @media(max-width:520px){body{padding:16px}.logo{height:190px}.card{padding:25px 18px}}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="/the-wall.png" alt="The Wall"></div>
    <p class="tagline">EVERY PLACE HAS SOMETHING TO SAY.</p>
    <section class="card">
      <div class="tap">◉</div>
      <h1>You found a Wall.</h1>
      <p id="message">Open The Wall to read what people left behind here — and, after a physical plaque tap, leave your own mark.</p>
      <a id="open-app" class="button" href="saidhere://">OPEN THE WALL</a>
      <p class="muted">If the app is installed, plaque links normally open it automatically.</p>
    </section>
    <footer><a href="/privacy/">Privacy</a> · <a href="/support/">Support</a></footer>
  </main>
  <script>
    const path = window.location.pathname;
    const link = document.getElementById('open-app');
    if (path.startsWith('/t/')) link.href = 'saidhere://' + path.slice(1);
    else if (path.startsWith('/w/')) link.href = 'saidhere://' + path.slice(1);
  </script>
</body>
</html>
