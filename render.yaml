projects:
  - name: The Wall
    environments:
      - name: Production
        services:
          - type: web
            name: saidhere-api-9ab3
            runtime: node
            plan: free
            region: singapore
            rootDir: server
            buildCommand: >-
              npm install &&
              rm -rf public &&
              cp -R ../site public &&
              cp "../lib/theme/Grungy Graffiti Wall_ The Wall.png" public/the-wall.png &&
              cp "../lib/267ABF9F-A613-4DD2-B026-87B6C2B6AEBD.png" public/plaque.png &&
              cp "../lib/12CA723C-705E-4593-834A-72D72424FC4F.png" public/wall-background.png
            startCommand: npm run migrate && npm start
            healthCheckPath: /health
            domains:
              - saidhere.app
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: saidhere-db-9ab3
                  property: connectionString
              - key: PUBLIC_APP_URL
                value: https://saidhere.app
              - key: CORS_ORIGIN
                value: https://saidhere.app,https://www.saidhere.app,https://saidhere-api-9ab3.onrender.com
              - key: ADMIN_KEY
                generateValue: true
              - key: STRIPE_SECRET_KEY
                sync: false
              - key: STRIPE_PRICE_WALL_PLAQUE
                sync: false
              - key: STRIPE_WEBHOOK_SECRET
                sync: false
              - key: WALL_PLAQUE_DISPLAY_PRICE
                value: A$15.00
              - key: STRIPE_SHIPPING_COUNTRIES
                value: AU
              - key: RESEND_API_KEY
                sync: false
              - key: CUSTOMER_EMAIL_FROM
                value: The Wall <orders@saidhere.app>
              - key: ORDER_EMAIL_FROM
                value: The Wall <orders@saidhere.app>
              - key: ORDER_NOTIFICATION_EMAIL
                sync: false

        databases:
          - name: saidhere-db-9ab3
            plan: free
            region: singapore
            databaseName: saidhere
            user: saidhere
            ipAllowList: []
